name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: true

jobs:
  test:
    name: Run backend test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run test suite
        run: php artisan test --compact

  deploy:
    name: Deploy backend to VPS
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS || vars.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/cpanel_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cpanel_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy backend through SSH
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST || vars.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USERNAME || secrets.CPANEL_SSH_USER || vars.CPANEL_SSH_USERNAME || vars.CPANEL_SSH_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || secrets.CPANEL_SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ vars.CPANEL_DEPLOY_PATH || secrets.CPANEL_DEPLOY_PATH }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${SSH_HOST:-}" ]]; then
            echo "::error::CPANEL_SSH_HOST is not set."
            exit 1
          fi
          if [[ -z "${SSH_USER:-}" ]]; then
            echo "::error::CPANEL_SSH_USERNAME or CPANEL_SSH_USER is not set."
            exit 1
          fi
          if [[ ! "${SSH_PORT:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::CPANEL_SSH_PORT must be numeric."
            exit 1
          fi
          if [[ -z "${DEPLOY_PATH:-}" ]]; then
            echo "::error::CPANEL_DEPLOY_PATH is not set."
            exit 1
          fi
          if [[ ! "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "${DEPLOY_PATH}" == "/" ]] || [[ ${#DEPLOY_PATH} -lt 10 ]]; then
            echo "::error::CPANEL_DEPLOY_PATH must be a specific absolute document-root path."
            exit 1
          fi

          SSH_OPTIONS="-i $HOME/.ssh/cpanel_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          bash -lc "ssh $SSH_OPTIONS -p '$SSH_PORT' '$SSH_USER@$SSH_HOST' bash -s -- '$DEPLOY_PATH' '$GITHUB_REF_NAME'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          cd "$1"
          echo ":: Pulling latest changes..."
          git pull origin "$2"

          echo ":: Installing composer dependencies..."
          composer install --no-dev --optimize-autoloader --no-interaction

          echo ":: Running migrations..."
          php artisan migrate --force --no-interaction

          echo ":: Optimizing application..."
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

          echo ":: Clearing old caches..."
          php artisan cache:clear

          echo ":: Deployment complete."
          REMOTE_SCRIPT
